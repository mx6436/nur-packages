# .github/workflows/update.yml
name: daily update

permissions:
  contents: write

on:
  schedule:
    # 每天 04:51 运行 (GMT+8)
    - cron: '51 20 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      # 准备 nix 环境以便 fish 脚本可以通过 `nix shell …` 运行
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: configure git
        run: |
          git config user.name "github actions"
          git config user.email "actions@github.com"

      - name: update reliquary-archiver
        run: |
          chmod +x pkgs/reliquary-archiver/update.fish
          pkgs/reliquary-archiver/update.fish

      - name: commit & push reliquary-archiver
        run: |
          if ! git diff --quiet pkgs/reliquary-archiver/manifest.json; then
            OLD_REV=$(git show HEAD:pkgs/reliquary-archiver/manifest.json | jq -r '.gameDataRev' 2>/dev/null || echo "unknown")
            NEW_REV=$(jq -r '.gameDataRev' pkgs/reliquary-archiver/manifest.json)

            git add pkgs/reliquary-archiver/manifest.json
            git commit -m "reliquary-archiver: update resource (${OLD_REV:0:7} -> ${NEW_REV:0:7})"
            git push
          else
            echo "No changes to commit"
          fi

      # maaend 的 update.fish 只依赖 PATH 中的工具，这里通过 nix shell 提供
      - name: update maaend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x pkgs/maaend/update.fish
          nix shell nixpkgs#fish nixpkgs#nix nixpkgs#jq nixpkgs#curl nixpkgs#gnused nixpkgs#git \
            --command fish pkgs/maaend/update.fish

      - name: commit & push maaend
        run: |
          if ! git diff --quiet pkgs/maaend/package.nix; then
            OLD_VERSION=$(git show HEAD:pkgs/maaend/package.nix | sed -nE 's/^  version = "(.*)";$/\1/p')
            NEW_VERSION=$(sed -nE 's/^  version = "(.*)";$/\1/p' pkgs/maaend/package.nix)

            git add pkgs/maaend/package.nix
            git commit -m "maaend: ${OLD_VERSION} -> ${NEW_VERSION}"
            git push
          else
            echo "No changes to maaend"
          fi
