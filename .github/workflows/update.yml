# .github/workflows/update.yml
name: daily update

permissions:
  contents: write

on:
  schedule:
    # 每天 04:51 运行 (GMT+8)
    - cron: '51 20 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      # 准备 nix 环境以便 fish 脚本可以通过 `nix shell …` 运行
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: update reliquary-archiver
        run: |
          chmod +x pkgs/reliquary-archiver/update.fish
          pkgs/reliquary-archiver/update.fish

      - name: commit & push reliquary-archiver
        run: |
          git config user.name "github actions"
          git config user.email "actions@github.com"

          if ! git diff --quiet pkgs/reliquary-archiver/manifest.json; then
            OLD_REV=$(git show HEAD:pkgs/reliquary-archiver/manifest.json | jq -r '.gameDataRev' 2>/dev/null || echo "unknown")
            NEW_REV=$(jq -r '.gameDataRev' pkgs/reliquary-archiver/manifest.json)

            git add pkgs/reliquary-archiver/manifest.json
            git commit -m "reliquary-archiver: update resource (${OLD_REV:0:7} -> ${NEW_REV:0:7})"
            git push
          else
            echo "No changes to commit"
          fi

      - name: update maaend
        run: |
          chmod +x pkgs/maaend/update.fish
          pkgs/maaend/update.fish

      - name: commit & push maaend
        run: |
          if ! git diff --quiet pkgs/maaend/version.json; then
            OLD_BETA=$(git show HEAD:pkgs/maaend/version.json | jq -r '.beta.version')
            OLD_STABLE=$(git show HEAD:pkgs/maaend/version.json | jq -r '.stable.version')
            NEW_BETA=$(jq -r '.beta.version' pkgs/maaend/version.json)
            NEW_STABLE=$(jq -r '.stable.version' pkgs/maaend/version.json)

            if [ "$OLD_BETA" != "$NEW_BETA" ]; then
              MSG="maaend-beta: $OLD_BETA -> $NEW_BETA"
            elif [ "$OLD_STABLE" != "$NEW_STABLE" ]; then
              MSG="maaend: $OLD_STABLE -> $NEW_STABLE"
            else
              echo "No variant version changed, skipping commit"
              exit 0
            fi

            git add pkgs/maaend/version.json
            git commit -m "$MSG"
            git push
          else
            echo "No changes to maaend"
          fi
