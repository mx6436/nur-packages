# .github/workflows/update.yml
name: daily update

permissions:
  contents: write

on:
  schedule:
    # UTC 时间，每天 04:00 运行
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      # 准备 nix 环境以便 fish 脚本可以通过 `nix shell …` 运行
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: run update script
        run: |
          chmod +x pkgs/reliquary-archiver/update.fish
          pkgs/reliquary-archiver/update.fish

      - name: commit & push
        run: |
          git config user.name "github actions"
          git config user.email "actions@github.com"
          
          # 检查 manifest.json 是否被修改
          if ! git diff --quiet pkgs/reliquary-archiver/manifest.json; then
            OLD_REV=$(git show HEAD:pkgs/reliquary-archiver/manifest.json | jq -r '.gameDataRev' 2>/dev/null || echo "unknown")
            NEW_REV=$(jq -r '.gameDataRev' pkgs/reliquary-archiver/manifest.json)
            
            git add pkgs/reliquary-archiver/manifest.json
            git commit -m "reliquary-archiver: update resource (${OLD_REV:0:7} -> ${NEW_REV:0:7})"
            git push
          else
            echo "No changes to commit"
          fi
